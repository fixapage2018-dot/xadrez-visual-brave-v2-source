
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Encontrar e extrair ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum ZIP encontrado no repositório."
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          mkdir -p projeto
          unzip -o "$ZIP" -d projeto

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find projeto -type f \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle.kts não encontrado."
            echo "Conteúdo extraído:"
            find projeto -maxdepth 5 -type f
            exit 1
          fi

          echo "Projeto encontrado em: $(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" \
            >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          APK=$(find app/build/outputs/apk/debug \
            -name "*.apk" -type f -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/xadrez-celular.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: xadrez-celular-apk
          path: xadrez-celular.apk
          if-no-files-found: error
