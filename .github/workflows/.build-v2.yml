name: Compilar APK Xadrez V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto corrigido
        shell: bash
        run: |
          set -e
          ZIP="xadrez-visual-fix-leitura-experimental-fonte.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo $ZIP não encontrado na raiz do repositório."
            echo "Arquivos ZIP disponíveis:"
            find . -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p /tmp/xadrez
          unzip -q "$ZIP" -d /tmp/xadrez

          ROOT="$(find /tmp/xadrez \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -type f | head -n 1)"

          if [ -z "$ROOT" ]; then
            echo "ERRO: o ZIP não contém um projeto Gradle Android reconhecível."
            find /tmp/xadrez -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$ROOT")"
          cp -a "$PROJECT_DIR"/. .
          test -f settings.gradle -o -f settings.gradle.kts

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar mecanismo de xadrez
        run: python3 scripts/prepare_engine.py

      - name: Testar regras
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/chess-tests
          javac -d /tmp/chess-tests \
            app/src/main/java/br/com/xadrezvisual/Board.java \
            tests/BoardTest.java
          java -Xmx512m -cp /tmp/chess-tests BoardTest

      - name: Compilar APK
        run: gradle :app:assembleDebug --console=plain

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: XadrezVisual-Android-teste
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
