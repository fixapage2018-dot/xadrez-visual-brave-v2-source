
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto ZIP
        run: |
          unzip -o xadrez-celular.zip -d projeto
          find projeto -name settings.gradle.kts -print

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: |
          DIR=$(find projeto -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$DIR" ]; then
            echo "ERRO: settings.gradle.kts não encontrado dentro do ZIP"
            exit 1
          fi
          cd "$DIR"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: xadrez-celular-debug-apk
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
