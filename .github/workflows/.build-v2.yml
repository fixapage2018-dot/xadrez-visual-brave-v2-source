
name: Compilar APK Xadrez V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto corrigido
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/xadrez
          unzip -q xadrez-visual-v2-correcao-area.zip -d /tmp/xadrez

          ROOT="$(find /tmp/xadrez -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          test -n "$ROOT"

          PROJECT_DIR="$(dirname "$ROOT")"
          cp -a "$PROJECT_DIR"/. .
          test -f settings.gradle -o -f settings.gradle.kts

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar mecanismo de xadrez
        run: python3 scripts/prepare_engine.py

      - name: Testar regras
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/chess-tests
          javac -d /tmp/chess-tests \
            app/src/main/java/br/com/xadrezvisual/Board.java \
            tests/BoardTest.java
          java -Xmx512m -cp /tmp/chess-tests BoardTest

      - name: Compilar APK
        run: gradle :app:assembleDebug --console=plain

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: XadrezVisual-Android-teste
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
