
name: Compilar APK Xadrez V2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -q xadrez-visual-brave-v2-teste-fonte.zip -d /tmp/xadrez
          cp -a /tmp/xadrez/xadrez-visual-android-main/. .

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar mecanismo de xadrez
        run: python3 scripts/prepare_engine.py

      - name: Testar regras
        run: |
          mkdir -p /tmp/chess-tests
          javac -d /tmp/chess-tests app/src/main/java/br/com/xadrezvisual/Board.java tests/BoardTest.java
          java -Xmx512m -cp /tmp/chess-tests BoardTest

      - name: Compilar APK
        run: gradle :app:assembleDebug --console=plain

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: XadrezVisual-Android-teste
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
